<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>AI Auto — предпросмотр в iPhone</title>
    <!--
      Предпросмотр AI Auto в рамке iPhone. Только для локальной разработки.

      Страница лежит вне src/ и public/, поэтому в сборку сайта (dist), в Android- и iOS-приложение
      и на GitHub Pages не попадает. Внутри рамки — настоящее приложение с локального сервера Vite,
      а не картинка: открывать по адресу http://localhost:5173/preview/iphone.html при запущенном
      «npm.cmd run dev».

      Рамка, строка состояния и Dynamic Island нарисованы здесь и в само приложение не внедряются.
    -->
    <link rel="stylesheet" href="./iphone.css" />
  </head>
  <body>
    <header class="panel" aria-label="Управление предпросмотром">
      <strong class="panel__title">AI Auto · iPhone</strong>

      <label class="panel__field">
        <span>Устройство</span>
        <select id="device">
          <option value="15">iPhone 15 · 393×852</option>
          <option value="15-pro-max">iPhone 15 Pro Max · 430×932</option>
        </select>
      </label>

      <label class="panel__field">
        <span>Масштаб</span>
        <select id="scale">
          <option value="fit">По окну</option>
          <option value="0.5">50%</option>
          <option value="0.75">75%</option>
          <option value="1">100%</option>
          <option value="1.25">125%</option>
        </select>
      </label>

      <label class="panel__field">
        <span>Рамка</span>
        <select id="frame">
          <option value="black">Чёрная</option>
          <option value="titanium">Титан</option>
          <option value="blue">Синяя</option>
          <option value="white">Белая</option>
        </select>
      </label>

      <!-- Маршруты взяты из src/App.tsx и src/data/content.ts. Кабинет без входа сам откроет страницу входа -->
      <nav class="panel__links" aria-label="Страницы приложения">
        <button type="button" data-route="/">Главная</button>
        <button type="button" data-route="/login">Вход</button>
        <button type="button" data-route="/app/car">Кабинет</button>
        <button type="button" data-route="/assistant">Помощник</button>
        <button type="button" id="reload" title="Перезагрузить приложение в рамке">Обновить</button>
      </nav>

      <span class="panel__path" id="path" title="Текущий адрес внутри рамки"></span>
    </header>

    <main class="stage" id="stage">
      <div class="phone" id="phone" data-frame="black">
        <!-- боковые кнопки -->
        <span class="phone__button phone__button--action" aria-hidden="true"></span>
        <span class="phone__button phone__button--volume-up" aria-hidden="true"></span>
        <span class="phone__button phone__button--volume-down" aria-hidden="true"></span>
        <span class="phone__button phone__button--power" aria-hidden="true"></span>

        <div class="phone__screen" id="screen">
          <div class="statusbar" aria-hidden="true">
            <span class="statusbar__time" id="clock">9:41</span>
            <span class="island"><span class="island__lens"></span></span>
            <span class="statusbar__icons">
              <!-- сотовый сигнал -->
              <svg viewBox="0 0 18 12" width="18" height="12"><rect x="0" y="8" width="3" height="4" rx="0.8" /><rect x="5" y="5.5" width="3" height="6.5" rx="0.8" /><rect x="10" y="3" width="3" height="9" rx="0.8" /><rect x="15" y="0" width="3" height="12" rx="0.8" /></svg>
              <!-- Wi-Fi -->
              <svg viewBox="0 0 17 12" width="17" height="12"><path d="M8.5 2.1c2.5 0 4.8 1 6.5 2.6.2.2.5.2.7 0l.7-.8c.2-.2.2-.5 0-.7A11.4 11.4 0 0 0 8.5 0C5.500 0 2.700 1.200.600 3.200c-.2.2-.2.5 0 .7l.7.8c.2.2.5.2.7 0A9.300 9.300 0 0 1 8.500 2.100Zm0 3.500c1.500 0 2.900.6 4 1.600.2.2.5.2.7 0l.7-.8c.2-.2.2-.5 0-.7a7.900 7.900 0 0 0-10.800 0c-.2.2-.2.5 0 .7l.7.8c.2.2.5.2.7 0 1.100-1 2.500-1.600 4-1.600Zm2.300 3.200c.2-.2.2-.5 0-.7a3.500 3.500 0 0 0-4.600 0c-.2.2-.2.5 0 .7l1.900 2c.2.300.6.300.800 0l1.900-2Z" /></svg>
              <!-- батарея -->
              <svg viewBox="0 0 27 13" width="27" height="13"><rect x="0.5" y="0.5" width="22" height="12" rx="3.8" fill="none" stroke="currentColor" opacity="0.4" /><rect x="2" y="2" width="19" height="9" rx="2.4" /><path d="M24 4.3v4.4c.8-.3 1.500-1.200 1.500-2.200s-.7-1.900-1.500-2.200Z" opacity="0.45" /></svg>
            </span>
          </div>

          <iframe class="phone__app" id="app" title="AI Auto"></iframe>

          <div class="homebar" aria-hidden="true"><span></span></div>

          <div class="notice" id="notice" hidden>
            <p class="notice__title">Приложение не отвечает</p>
            <p>Локальный сервер разработки не запущен или работает на другом адресе.</p>
            <p>Запустите в терминале VS Code:</p>
            <code>npm.cmd run dev</code>
            <p>и откройте <span id="notice-url"></span></p>
            <button type="button" id="retry">Проверить ещё раз</button>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="./iphone.js"></script>
  </body>
</html>
