name: Сборка iOS (симулятор)

# Собирает приложение AI Auto для симулятора iOS в облаке и пробует запустить его там.
# Xcode на своём компьютере не нужен.
#
# Запуск только вручную: вкладка Actions → «Сборка iOS (симулятор)» → Run workflow.
# Результаты — внизу страницы запуска в разделе Artifacts, хранятся 7 дней:
#   AI-Auto-ios-simulator-app — собранное приложение (архив с App.app);
#   AI-Auto-ios-simulator-screenshots — снимки экрана, если приложение удалось запустить.
# Что получилось, а что нет, написано в сводке запуска (вкладка Summary).
#
# Сборка для симулятора не требует аккаунта Apple Developer, сертификатов и профилей:
# подпись отключена. На iPhone такое приложение не установить и в App Store не отправить.
# Ключей подписи и секретов этот процесс не использует и не создаёт.
#
# У облачного компьютера нет экрана: приложением в симуляторе нельзя управлять вручную,
# можно только запустить его и снять экран.

on:
  workflow_dispatch:

# только чтение репозитория: процесс ничего не публикует и не изменяет
permissions:
  contents: read

concurrency:
  group: ios-simulator
  cancel-in-progress: true

jobs:
  simulator:
    name: Приложение для симулятора
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APP_ID: kz.aiauto.app
      DERIVED: ${{ github.workspace }}/build/ios
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Capacitor 8 рассчитан на свежий Xcode, поэтому берётся самая новая версия из установленных на компьютере сборки
      - name: Выбор Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest/Contents/Developer"; fi
          xcodebuild -version

      # Адрес проекта Supabase и публичный ключ встраиваются в приложение при сборке — так же, как в сайт.
      # Берутся только переменные репозитория (Settings → Secrets and variables → Actions → Variables).
      # Секретный ключ (sb_secret_… или service_role) в приложение попасть не должен. Значения в журнал не выводятся.
      - name: Проверка настроек Supabase
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          echo "Адрес проекта найден: $([ -n "$SUPABASE_URL" ] && echo да || echo НЕТ)"
          echo "Публичный ключ найден: $([ -n "$SUPABASE_KEY" ] && echo да || echo НЕТ)"
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Не найдены VITE_SUPABASE_URL или VITE_SUPABASE_ANON_KEY. Добавьте их как переменные репозитория: Settings → Secrets and variables → Actions → вкладка Variables → New repository variable."
            exit 1
          fi
          case "$SUPABASE_KEY" in
            sb_secret_*)
              echo "::error::В VITE_SUPABASE_ANON_KEY указан секретный ключ. В приложение можно встраивать только публичный (anon / publishable)."
              exit 1
              ;;
          esac
          # ключ старого формата — JWT; роль записана в его средней части
          payload=$(printf '%s' "$SUPABASE_KEY" | cut -s -d. -f2 | tr '_-' '/+')
          if [ -n "$payload" ]; then
            while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
            if printf '%s' "$payload" | base64 -d 2>/dev/null | grep -q '"role"[[:space:]]*:[[:space:]]*"service_role"'; then
              echo "::error::В VITE_SUPABASE_ANON_KEY указан ключ service_role. В приложение можно встраивать только публичный ключ."
              exit 1
            fi
          fi
          echo "Ключ не похож на секретный."

      - name: Установка зависимостей
        run: npm ci

      # Тот же скрипт сборки, что у сайта, но с корневым путём «/»
      - name: Сборка веб-приложения
        run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Проверка сборки веб-приложения
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html не создан"; exit 1; }
          if grep -q '/AI-Auto/assets/\|/site2/assets/' dist/index.html; then
            echo "::error::Веб-приложение собрано с путём сайта, а не с «/»"
            exit 1
          fi

      - name: Копирование веб-приложения в iOS-проект
        run: npx cap sync ios

      # Берётся любой доступный на компьютере сборки симулятор iPhone: набор моделей зависит от версии Xcode
      - name: Выбор симулятора
        id: device
        run: |
          xcrun simctl list devices available
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          phones = [(runtime, d) for runtime, items in data.items() if 'iOS' in runtime for d in items if d.get('isAvailable') and d['name'].startswith('iPhone')]
          phones.sort(key=lambda item: [int(n) for n in item[0].split('iOS-')[-1].split('-') if n.isdigit()])
          print(phones[-1][1]['udid'] if phones else '')
          ")
          if [ -z "$udid" ]; then
            echo "::error::На компьютере сборки нет доступного симулятора iPhone"
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "Выбран симулятор: $(xcrun simctl list devices available | grep "$udid")"

      # Схема «App» в проекте Capacitor создаётся автоматически; её имя на всякий случай читается из проекта
      - name: Сборка для симулятора
        run: |
          xcodebuild -list -project ios/App/App.xcodeproj
          scheme=$(xcodebuild -list -json -project ios/App/App.xcodeproj | python3 -c "import json,sys; s=json.load(sys.stdin)['project'].get('schemes') or []; print('App' if 'App' in s or not s else s[0])")
          echo "Схема: $scheme"
          # подпись отключена: симулятору она не нужна, сертификатов и профилей нет
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme "$scheme" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.device.outputs.udid }}" \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Проверка приложения
        id: app
        run: |
          app="$DERIVED/Build/Products/Debug-iphonesimulator/App.app"
          if [ ! -d "$app" ] || [ ! -f "$app/Info.plist" ]; then
            echo "::error::Приложение для симулятора не найдено: $app"
            ls -R "$DERIVED/Build/Products" 2>/dev/null | head -50 || true
            exit 1
          fi
          id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Info.plist")
          echo "Идентификатор в приложении: $id"
          test "$id" = "$APP_ID" || { echo "::error::Ожидался идентификатор $APP_ID"; exit 1; }
          test -f "$app/public/index.html" || { echo "::error::В приложении нет веб-части (public/index.html)"; exit 1; }
          ditto -c -k --keepParent "$app" AI-Auto-ios-simulator.zip
          echo "path=$app" >> "$GITHUB_OUTPUT"
          echo "Приложение собрано: $(du -sh "$app" | cut -f1)"

      - name: Сохранение приложения
        uses: actions/upload-artifact@v4
        with:
          name: AI-Auto-ios-simulator-app
          path: AI-Auto-ios-simulator.zip
          retention-days: 7
          if-no-files-found: error

      # Запуск в симуляторе — дополнительная проверка. Если он не удался, сборка остаётся успешной,
      # а причина честно записывается в сводку: успешный запуск не имитируется.
      - name: Запуск в симуляторе и снимки экрана
        id: run
        continue-on-error: true
        run: |
          udid="${{ steps.device.outputs.udid }}"
          mkdir -p screenshots
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "${{ steps.app.outputs.path }}"
          xcrun simctl launch "$udid" "$APP_ID" | tee launch.txt
          grep -q "$APP_ID: [0-9]" launch.txt
          # даём приложению время загрузить веб-часть
          sleep 20
          xcrun simctl io "$udid" screenshot screenshots/01-after-20s.png
          sleep 25
          xcrun simctl io "$udid" screenshot screenshots/02-after-45s.png
          # приложение должно быть всё ещё запущено, а не закрыться с ошибкой
          xcrun simctl spawn "$udid" launchctl list | grep -q "$APP_ID"
          test -s screenshots/01-after-20s.png

      - name: Сохранение снимков экрана
        if: always() && hashFiles('screenshots/*.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: AI-Auto-ios-simulator-screenshots
          path: screenshots/*.png
          retention-days: 7

      - name: Сводка
        if: always()
        run: |
          {
            echo "## Сборка iOS для симулятора"
            echo
            if [ -f AI-Auto-ios-simulator.zip ]; then
              echo "- Приложение собрано: артефакт **AI-Auto-ios-simulator-app**."
            else
              echo "- Приложение НЕ собрано — смотрите шаг с ошибкой."
            fi
            if [ "${{ steps.run.outcome }}" = "success" ]; then
              echo "- Приложение запущено в симуляторе и не закрылось за 45 секунд. Снимки экрана: артефакт **AI-Auto-ios-simulator-screenshots**."
              echo "- Снимок показывает только первый экран. Вход, работу кабинета и ИИ-помощника он не подтверждает."
            elif [ "${{ steps.run.outcome }}" = "failure" ]; then
              echo "- Запустить приложение в симуляторе или снять экран НЕ удалось. Причина — в журнале шага «Запуск в симуляторе и снимки экрана»."
              if ls screenshots/*.png >/dev/null 2>&1; then echo "- Часть снимков экрана всё же сохранена — они показывают состояние до сбоя."; fi
            else
              echo "- До запуска в симуляторе дело не дошло."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
